name: Build and Release AniPlayer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_tag }}" ]; then
            echo "tag=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web & Electron
        run: |
          npm run build
          npx vite build
          node -e "fs.copyFileSync('electron/preload.cjs','dist-electron/preload.cjs')"

      - name: Build Windows Installer (NSIS)
        run: npx electron-builder --win --x64 -p never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  build-ipad:
    needs: version
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync iOS Capacitor
        run: npx cap sync ios

      - name: Build Unsigned iOS Archive (.xcarchive)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned .ipa for Sideloading
        run: |
          cd ios/App
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r AniGemini.ipa Payload

      - name: Upload iPad Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipad-ipa
          path: ios/App/build/AniGemini.ipa

  release:
    needs: [version, build-windows, build-ipad]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/windows

      - name: Download iPad IPA
        uses: actions/download-artifact@v4
        with:
          name: ipad-ipa
          path: release-assets/ipad

      - name: Prepare Assets
        run: |
          mkdir -p final-assets
          find release-assets/windows -name "*.exe" -exec cp {} final-assets/ \;
          find release-assets/ipad -name "*.ipa" -exec cp {} final-assets/ \;
          ls -la final-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: AniGemini ${{ needs.version.outputs.tag }}
          body: |
            ## Релиз AniGemini ${{ needs.version.outputs.tag }}
            
            Кроссплатформенный аниме-плеер нового поколения для Windows и iPad.
            
            ### Новое в этой версии:
            - **Новое имя «AniGemini»**: уникальный идентификатор приложения (`com.anigemini.desktop`), изолированный путь установки и реестр. Теперь плеер не конфликтует и не удаляет другие плееры на компьютере.
            - **Встроенное автообновление в один клик**: в шапке плеера можно нажать «Обновить», плеер сам скачает обновление, покажет шкалу прогресса, тихо установит себя и перезапустится!
            - **Кнопки окна**: кнопки `✕` (Выйти/Закрыть), `▢` (Развернуть), `─` (Свернуть) всегда доступны в правом верхнем углу.
            - **Нативный UI-масштаб**: reflow без сдвигов и черных полос при 80% и 120%.
            - **Автоматический резолв постеров**: никаких скетчей «404 not found» — постеры гарантированно подтягиваются даже для тайтлов с ограничениями в Shikimori (Тетрадь смерти, Re:Zero 4, Steel Ball Run).
            - **Полная сетка серий**: автоматическая загрузка всех 25 серий Врат Штейна, 28 серий Фрирен, и гарантированный список серий для всех тайтлов мира.
            
            ### Файлы для установки:
            - **Windows**: `AniGemini-Setup-*.exe` — автономный установщик с ярлыком на рабочем столе и поддержкой автообновлений.
            - **iPad**: `AniGemini.ipa` — неподписанный пакет для установки через сайдлоад (TrollStore, AltStore, Sideloadly, Scarlet).
          files: final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
