name: Build and Release AniPlayer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_tag }}" ]; then
            echo "tag=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web & Electron
        run: |
          npm run build
          npx vite build
          node -e "fs.copyFileSync('electron/preload.cjs','dist-electron/preload.cjs')"

      - name: Build Windows Installer (NSIS)
        run: npx electron-builder --win --x64 -p never

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  build-ipad:
    needs: version
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync iOS Capacitor
        run: npx cap sync ios

      - name: Build Unsigned iOS Archive (.xcarchive)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned .ipa for Sideloading
        run: |
          cd ios/App
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r AniPlayer.ipa Payload

      - name: Upload iPad Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipad-ipa
          path: ios/App/build/AniPlayer.ipa

  release:
    needs: [version, build-windows, build-ipad]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/windows

      - name: Download iPad IPA
        uses: actions/download-artifact@v4
        with:
          name: ipad-ipa
          path: release-assets/ipad

      - name: Prepare Assets
        run: |
          mkdir -p final-assets
          find release-assets/windows -name "*.exe" -exec cp {} final-assets/ \;
          find release-assets/ipad -name "*.ipa" -exec cp {} final-assets/ \;
          ls -la final-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: AniPlayer ${{ needs.version.outputs.tag }}
          body: |
            ## Релиз AniPlayer ${{ needs.version.outputs.tag }}
            
            Кроссплатформенный аниме-плеер в стиле Animix для Windows и iPad.
            
            ### Файлы для установки:
            - **Windows**: `AniPlayer-Setup-*.exe` — запускаемый установщик с ярлыком на рабочем столе и автообновлениями.
            - **iPad**: `AniPlayer.ipa` — неподписанный пакет для установки через сайдлоад (TrollStore, AltStore, Sideloadly, Scarlet).
            
            ### Возможности:
            - Темная эстетика Animix (сетка недавних, часы просмотра, карусели серий).
            - HLS-стриминг с AniLibria в качестве до 1080p FHD.
            - Альтернативные озвучки (Studio Band и др.) через открытые плееры YummyAnime.
            - Хронологическое дерево франшиз Shikimori (основные сезоны с частями, фильмы, спешлы).
            - Умный автопропуск опенингов и эндингов с таймером 5 сек.
            - Двойной тап перемотки ±10 сек для iPad с суммированием и автоскрытием статус-бара.
          files: final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
